<!doctype html>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
 html,body{margin:0;background:#0d1512;color:#dfe8e2;font:11px/1.32 ui-monospace,Menlo,monospace}
 #log{padding:6px 8px;white-space:pre-wrap}
 .ok{color:#8ee06a} .no{color:#ff7a7a} .h{color:#8fc7ff}
 iframe{position:fixed;right:0;bottom:0;width:402px;height:714px;border:0;opacity:.02;pointer-events:none}
</style>
<div id=verdict style="position:fixed;left:0;right:0;top:0;z-index:9;padding:6px 8px;background:#0d1512;border-bottom:1px solid #24352c;font-weight:700"></div>
<div id=log style="padding-top:30px">гоняю…</div>
<iframe id=f></iframe>
<script>
// Что проверять. По умолчанию /web-app/react/ — собранный бандл ссылается на
// ассеты по этому абсолютному пути, поэтому репозиторий обязан отдаваться как
// /web-app (см. README рядом). ?app=<url> — любая другая сборка того же origin.
const APP = new URLSearchParams(location.search).get('app') || '/web-app/react/index.html';
const F = document.getElementById('f'), LOG = document.getElementById('log');
let out = [], fails = 0;
// Сами провалившиеся строки, а не только счёт по разделам. Отчёт давно длиннее
// экрана, а проскроллить симулятор без тапа нельзя: раньше «ПРОВАЛОВ: 1 из 89»
// говорил, что что-то не так, но не что именно, и приходилось гадать.
let failMsgs = [];
// Разделы со счётом. Лог давно не влезает в экран, а проскроллить симулятор без
// тапа нельзя — поэтому итог по разделам печатается ПЕРВЫМ, и одного скриншота
// хватает, чтобы увидеть, что ни один раздел не пропущен молча.
let sections = [], cur = null;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const W = () => F.contentWindow, D = () => F.contentDocument;
const S = () => W().__state();
function say(ok, msg) {
  if (!ok) { fails++; failMsgs.push(msg) }
  if (cur) { ok ? cur.ok++ : cur.no++ }
  out.push(`<span class="${ok ? 'ok' : 'no'}">${ok ? '✓' : '✗'}</span> ${msg}`);
  LOG.innerHTML = out.join('<br>');
}
function head(t) {
  cur = {name: t, ok: 0, no: 0}; sections.push(cur);
  out.push(`<span class="h">── ${t}</span>`); LOG.innerHTML = out.join('<br>');
}
/** greet=true — сценарий про приветствие; иначе его гасим, чтобы лист не
    накрывал проверяемый экран и не давал ложных срабатываний. */
function seed(st, hash, greet) {
  const base = {v:1, plants:[], choices:{}, selected:0, isPro:false, units:'imperial', remind:3,
    care:{pick:true,leaf:true,rotate:true,feed:true}, mail:{weekly:true,water:true,news:false},
    done:{}, calView:'month', onbMode:null, account:null};
  const blob = Object.assign(base, st);
  localStorage.setItem('hg.state', JSON.stringify(blob));
  // Аккаунт в состоянии ПОДРАЗУМЕВАЕТ живую сессию: без неё приложение теперь
  // закрыто, и раздел, который проверяет экран настроек или аккаунта, упирался
  // бы в стену вместо проверяемого экрана. Раздел, которому нужна именно мёртвая
  // или отсутствующая сессия, говорит это явным putSession(-60) перед seed().
  if (!wantSession && blob.account && !blob.account.demo) putSession(86400);
  if (!wantSession) localStorage.removeItem(SESSION_KEY);
  wantSession = false;
  try {
    if (greet) sessionStorage.removeItem('hg.greeted');
    else sessionStorage.setItem('hg.greeted', '1');
  } catch (e) {}
  return load(hash);
}
function load(hash) {
  return new Promise(res => { F.onload = () => setTimeout(res, 430); F.src = APP + '?t=' + Date.now() + '#' + hash });
}
function el(text, sel) {
  return [...D().querySelectorAll(sel || '[role],input')].find(e =>
    ((e.getAttribute('aria-label') || '') + ' ' + (e.innerText || ''))
      .replace(/\s+/g, ' ').includes(text)) || null;
}
async function tap(text, sel) {
  const e = el(text, sel); if (!e) return false;
  e.click(); await sleep(220); return true;
}
/** ввод в управляемое React поле: нативный сеттер + событие input */
async function type(sel, text) {
  const e = D().querySelector(sel); if (!e) return false;
  const set = Object.getOwnPropertyDescriptor(W().HTMLInputElement.prototype, 'value').set;
  set.call(e, text);
  e.dispatchEvent(new (W().Event)('input', {bubbles: true}));
  await sleep(200); return true;
}
const hash = () => W().location.hash.slice(1);
/**
 * Синтетическая сессия Supabase прямо в localStorage. Настоящую без Google не
 * достать: анонимный вход в проекте выключен, а пароль человека вводить нельзя.
 * Без сессии же непроверяема половина входа — подхват аккаунта, мина
 * hg.authNext и непрошеный выход живут ТОЛЬКО у вошедшего. Токен не подписан
 * ключом проекта, поэтому PostgREST отвечает на него 401 — и это ровно то, что
 * нужно: проверяем поведение приложения, а не базу.
 * secondsLeft < 0 — токен уже истёк: библиотека пойдёт его обновлять, получит
 * отказ и снесёт сессию. Так выглядит обычный час жизни настоящей сессии.
 */
const SESSION_KEY = 'sb-bslttprzsbigcfplpxff-auth-token';
function sessionBlob(secondsLeft) {
  const now = Math.floor(Date.now() / 1000), exp = now + secondsLeft;
  const b64 = o => btoa(JSON.stringify(o)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const uid = '77777777-7777-4777-8777-777777777777';
  const iso = s => new Date(s * 1000).toISOString();
  return {
    access_token: [b64({alg: 'HS256', typ: 'JWT'}),
                   b64({sub: uid, aud: 'authenticated', role: 'authenticated', exp,
                        email: 'sam@example.com'}), 'sig'].join('.'),
    token_type: 'bearer', expires_in: secondsLeft, expires_at: exp,
    refresh_token: 'synthetic-refresh',
    user: {id: uid, aud: 'authenticated', role: 'authenticated', email: 'sam@example.com',
           email_confirmed_at: iso(now - 600), created_at: iso(now - 600), updated_at: iso(now),
           app_metadata: {provider: 'google', providers: ['google']},
           user_metadata: {}, identities: []},
  };
}
/**
 * Сессия — состояние ОРIGIN, а не страницы, и она переживает переход между
 * стендами: tapcheck кладёт свою синтетическую сессию, а authcheck идёт следом в
 * том же Safari и видит вошедшего там, где проверяет анонима. Поэтому seed()
 * ниже стирает сессию по умолчанию, а раздел, которому она нужна, просит её
 * явным putSession() перед seed().
 */
let wantSession = false;
const putSession = s => {
  wantSession = true;
  localStorage.setItem(SESSION_KEY, JSON.stringify(sessionBlob(s)));
};
/**
 * Стереть следы предыдущего раздела: причину прошлого провала И метку нарочного
 * выхода. Метка живёт в localStorage (иначе соседняя вкладка врёт человеку про
 * истёкшую сессию), а значит переживает переход между разделами: без уборки
 * раздел про умершую сессию попадал в 15-секундное окно от нажатого ранее
 * «Delete account» и молчал, хотя должен был объясниться.
 */
const clearErr = () => localStorage.removeItem('hg.authErr');
/**
 * Стереть метку нарочного выхода. Нужно ТОЛЬКО разделу про умершую сессию: там
 * тишина была бы ложным «пройдено». Остальным разделам чистить нельзя — выход из
 * предыдущего раздела доезжает асинхронно (Delete account не ждёт уборки в
 * облаке), и без метки его SIGNED_OUT выглядит как непрошеный.
 */
const clearOut = () => localStorage.removeItem('hg.signOutAt');
/**
 * Ждать условия, а не «столько-то миллисекунд». Выход и обновление токена ходят
 * в сеть, и на симуляторе это заметно медленнее, чем в десктопном браузере:
 * фиксированная пауза давала ложный провал там, где всё работает, просто позже.
 */
async function waitFor(ok, ms) {
  const t0 = Date.now();
  while (Date.now() - t0 < (ms || 5000)) { if (ok()) return true; await sleep(120) }
  return ok();
}
const footOff = () => { const b = D().querySelector('.foot .btn'); return b ? b.className.includes('off') : null };

(async () => {
  // ── 1. Вход для вернувшегося: ссылка с лендинга
  head('вход с лендинга');
  await seed({}, 'landing');
  say(!!el('Sign in'), 'на лендинге есть ссылка входа');
  await tap('Sign in');
  say(hash() === 'signin', 'лендинг → signin (' + hash() + ')');
  const btns = [...D().querySelectorAll('.btn')].map(b => b.innerText.replace(/\s+/g,' ').trim());
  say(btns.some(b => b.includes('Google')) && !btns.some(b => b.includes('email')),
      'одна рабочая дверь — Google: ' + btns.slice(0, 2).join(' / '));
  const logo = D().querySelector('.prov img');
  if (logo && !logo.complete) { try { await logo.decode() } catch (e) {} }
  await sleep(250);
  say(!!logo && logo.naturalWidth > 0,
      'логотип Google загрузился (' + (logo ? logo.naturalWidth + 'px, ' + logo.currentSrc.split('/').slice(-2).join('/') : 'нет img') + ')');
  say(!D().querySelector('.nav'), 'на входе нет таб-бара');

  // ── 2. Google: настоящий вход через Supabase
  head('Google — настоящий');
  const sb = await W().__supa();
  say(!!sb && !!sb.auth, 'клиент Supabase загрузился (отдельным чанком)');
  const { data: ses, error: sesErr } = await sb.auth.getSession();
  say(!sesErr && ses.session === null, 'сессии нет и ошибки нет (аноним)');
  // Адрес возврата НЕ зашит: спрашиваем его у самого приложения. Раньше здесь
  // стоял хост строкой, и стенд пришлось бы править при каждом переезде — а
  // главное, он проверял бы не то, что приложение реально отправляет провайдеру,
  // а то, что когда-то вписали в стенд. Теперь сверяется настоящее значение.
  const wantRedirect = W().__authRedirect();
  const { data: oa, error: oaErr } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: wantRedirect, skipBrowserRedirect: true } });
  const u = (oa && oa.url) || '';
  say(!oaErr && !!u, 'ссылка входа построена' + (oaErr ? ': ' + oaErr.message : ''));
  say(u.startsWith('https://bslttprzsbigcfplpxff.supabase.co/auth/v1/authorize?provider=google'),
      'ведёт в authorize провайдера google');
  say(u.includes('code_challenge'), 'PKCE: в ссылке code_challenge, токены не уедут в хеш');
  say(u.includes(encodeURIComponent(wantRedirect)) || u.includes(wantRedirect),
      'возврат на адрес приложения: ' + wantRedirect);
  say(!S().account, 'демо-аккаунт при этом не создаётся');

  // ── 2b. Apple: кнопки нет, пока нет ключей — и она никого не впускает
  head('Apple — выключен, а не поддельный');
  await seed({}, 'signin');
  const labels = [...D().querySelectorAll('.btn')].map(b => b.innerText.trim());
  say(!labels.some(l => l.includes('Apple')), 'кнопки Apple нет: ' + labels.join(' / '));
  say((D().querySelector('.prov-note') || {}).innerText?.includes('Apple'),
      'вместо неё подпись, почему её нет');
  say(!S().account, 'аккаунт не заводится сам собой');

  // ── 3. Почта: валидация
  head('почта — закрыта, пока демонстрационная');
  await seed({}, 'signin');
  const doors = [...D().querySelectorAll('.btn')].map(x => x.innerText.replace(/\s+/g,' ').trim());
  say(!doors.some(x => /email/i.test(x)), 'кнопки «Continue with email» нет: '
      + doors.slice(0, 2).join(' / '));
  say((D().querySelector('.prov-note') || {}).innerText?.includes('email'),
      'вместо неё подпись, почему её нет');
  // Дверь закрыта именно потому, что вход по почте демонстрационный: он выдаёт
  // аккаунт БЕЗ серверной сессии, а без сессии приложение теперь не открывается.
  // Экраны никуда не удалены — они за флагом EMAIL_READY.
  await seed({}, 'email');
  say(!S().account, 'прямая ссылка на экран почты аккаунта не выдаёт');

  head('вход из онбординга');
  await seed({}, 'save');
  say(!!el('Continue with Google'), 'на Save есть Google');
  say(!el('Continue with email'), 'демонстрационной двери на Save нет');
  say(!S().account, 'и аккаунт сам собой не появляется');

  // ── 5b. Онбординг НЕ выпускает в приложение без аккаунта. Ровно так и
  //     пришла жалоба «прошёл онборд, а в настройках висит Sign in»: с preview
  //     ссылка «I’ll pick my own» открывала библиотеку как экран ПРИЛОЖЕНИЯ —
  //     с таб-баром, «назад» на Home и кнопкой внизу на Home. Человек попадал
  //     внутрь, минуя Save, и Google тут был не при чём.
  head('онбординг не выпускает без аккаунта');
  await seed({onbMode: 'plan'}, 'preview');
  say(!D().querySelector('.nav'), 'на preview таб-бара нет');
  await tap('pick my own');
  say(hash() === 'add-plant', 'preview → add-plant (' + hash() + ')');
  say(!D().querySelector('.nav'), 'в библиотеке как шаге онбординга таб-бара нет');
  // Дальше читаем DOM защищённо: когда эта секция ПАДАЕТ, приложение уже увело
  // в другой экран, и голый .click() по отсутствующему узлу обрушил бы стенд
  // целиком — вместе с разделами после него.
  const bk = D().querySelector('.back');
  if (bk) { bk.click(); await sleep(280) }
  say(hash() === 'preview', 'назад ведёт на preview, а не в приложение (' + hash() + ')');
  if (hash() !== 'add-plant') await tap('pick my own');
  const row = D().querySelector('.plist > *');
  if (row) { row.click(); await sleep(220) }
  const fb = D().querySelector('.foot .btn');
  if (fb) { fb.click(); await sleep(320) }
  say(hash() === 'save', 'кнопка внизу ведёт на регистрацию (' + hash() + ')');
  say(!S().account, 'аккаунт по дороге сам не появился');
  say((D().querySelector('.overlay') || {}).innerText?.includes('Save your plants'),
      'на Save обещают сохранить СВОИ растения, а не «наш план»');

  // ── 6. Настройки → экран аккаунта. Выход и удаление переехали туда: среди
  //     тумблеров необратимого не ждут, а крестик 32x32 не дотягивал до 44.
  head('аккаунт в настройках');
  await seed({account: {email: 'sam@example.com', via: 'email'}}, 'settings');
  say((D().querySelector('.acct') || {}).innerText?.includes('sam@example.com'),
      'настройки показывают почту вошедшего');
  say(!el('Sign out') && !el('Delete account'),
      'в настройках больше нет ни выхода, ни удаления');
  const accRow = D().querySelector('.acc-who');
  say(!!accRow && accRow.getAttribute('role') === 'button', 'строка аккаунта — ссылка');
  say(!!accRow && accRow.getBoundingClientRect().height >= 44,
      'тап-зона строки ≥44px: ' + (accRow ? Math.round(accRow.getBoundingClientRect().height) : '—'));
  accRow.click(); await sleep(280);
  say(hash() === 'account', 'строка аккаунта → account (' + hash() + ')');

  head('экран аккаунта');
  // Аккаунт теперь ЛИСТ поверх настроек, а не отдельный экран, поэтому запросы
  // сужены до .cf-box. Без этого стенд мерил бы настройки, которые стоят за
  // скримом: у них свой .acct (строка аккаунта) и десяток своих .plist .pl.
  const SH = sel => [...D().querySelectorAll('.cf-box ' + sel)];
  const sheet = D().querySelector('.cf-box');
  say(!!sheet && sheet.getAttribute('role') === 'dialog',
      'аккаунт приходит листом: role=' + (sheet ? sheet.getAttribute('role') : 'нет .cf-box'));
  say(!!D().querySelector('.cf-sc'), 'под листом скрим');
  say(!!D().querySelector('#s-settings'), 'за листом видны настройки, а не пустота');
  say(!!D().querySelector('.nav'), 'таб-бар на месте — он от настроек');
  const tall = sheet && W().getComputedStyle(sheet);
  say(!!tall && tall.overflowY === 'auto' && sheet.getBoundingClientRect().height <= D().documentElement.clientHeight,
      'лист не выше экрана и прокручивается внутри себя: '
      + (sheet ? Math.round(sheet.getBoundingClientRect().height) + 'px из '
                 + D().documentElement.clientHeight : '—'));
  // Отступы внутри листа: --s1/--s2 объявлены на .screen, а лист рендерится
  // соседом экрана. Если контекст шкалы на .cf-box забыть, эти блоки молча
  // останутся без полей — дефект уже случался с padding самого листа. Мерим на
  // .danger (margin-top: --s2) и на ноте (--s2 от пилюли): карточки «Your data»,
  // на которой это проверялось раньше, больше нет.
  const dangerMt = SH('.danger')[0] && W().getComputedStyle(SH('.danger')[0]).marginTop;
  say(dangerMt === '16px', 'шкала внутри листа жива: у .danger верхний отступ ' + dangerMt);
  const noteMt = SH('.note')[0] && W().getComputedStyle(SH('.note')[0]).marginTop;
  say(noteMt === '16px', 'нота не приклеена к строке аккаунта: отступ ' + noteMt);
  say((SH('.acct')[0] || {}).innerText?.includes('Signed in with'),
      'лист называет способ входа');
  // Карточка «Your data» убрана по просьбе владельца: три строки-факта были
  // инженерной версией того, что нота говорит словами.
  say(SH('.plist').length === 0 && !/On the server|Last synced/.test(sheet.innerText),
      'карточки последней синхронизации в листе нет');
  say(SH('.note').length === 1, 'пояснение осталось, и оно одно: '
      + JSON.stringify((SH('.note')[0] || {}).innerText?.split('\n')[0] || '—'));
  // Селектор здесь обязателен, и это не перестраховка: контейнер листа несёт
  // role=dialog, а его innerText содержит подписи всех кнопок внутри. Без
  // селектора el() возвращал САМ ЛИСТ — проверка проходила бы и с исчезнувшими
  // кнопками, а tap() кликал в контейнер и ничего не делал. Готча описана в
  // README рядом, до этой правки она касалась только диалога удаления.
  say(!!el('Sign out', '.cf-box .btn') && !!el('Delete account', '.cf-box .danger'),
      'выход и удаление живут здесь');
  // Три равнозначных выхода. Крестик и скрим проверяем, Escape — с клавиатуры,
  // на телефоне его нет.
  await tap('Close');
  say(hash() === 'settings', 'крестик закрывает лист (' + hash() + ')');
  await tap('sam@example.com', '.acc-who');
  say(hash() === 'account', 'строка аккаунта открывает его снова (' + hash() + ')');
  D().querySelector('.cf-sc').click(); await sleep(280);
  say(hash() === 'settings', 'тап по скриму тоже закрывает (' + hash() + ')');
  await tap('sam@example.com', '.acc-who');
  say(hash() === 'account', 'и снова открыт (' + hash() + ')');
  await tap('Sign out', '.cf-box .btn');
  say(!S().account, 'выход очистил аккаунт');
  // Раньше выход вёл на home. Теперь home без сессии закрыт, и стена уводит на
  // вход — это и есть правильный конец выхода при закрытом приложении.
  say(hash() === 'signin', 'после выхода → вход (' + hash() + ')');
  // Состояния «настройки с кнопкой Sign in» больше НЕТ: без живой сессии
  // приложение закрыто целиком, и настройки в том числе. Проверяем то, что стало
  // правдой — стену.
  await seed({plants: [{id:'basil',since:1,day:20,photos:[]}]}, 'settings');
  say(hash() === 'signin', 'настройки без входа закрыты (' + hash() + ')');

  // ── 6b. Экрана входа для вошедшего не существует
  head('вошедшему не предлагают войти');
  await seed({account: {email: 'sam@example.com', via: 'google'}}, 'signin');
  say(hash() !== 'signin', 'signin у вошедшего уводит на ' + hash());
  say(!el('Continue with Google'), 'кнопки провайдера на экране нет');

  // ── 6c. Приветствие: раз за визит
  head('приветствие');
  await seed({account: {email: 'sam@example.com', via: 'google'},
              plants: [{id:'basil',since:9,day:20,photos:[]}]}, 'home', true);
  const gr = D().querySelector('[role=dialog]');
  say(!!gr, 'при заходе с сессией показан лист приветствия');
  say(!!gr && !gr.innerText.includes('Continue with Google'),
      'в нём нет предложения войти заново');
  say(!!gr && /week|schedule|empty/i.test(gr.innerText),
      'он говорит, что ждёт на этой неделе: '
      + (gr ? JSON.stringify(gr.innerText.split('\n')[1] || '').slice(0, 48) : '—'));
  say(!!D().querySelector('[role=alertdialog]') === false,
      'это dialog, а не alertdialog — единственный alertdialog остаётся у удаления');
  await tap('Keep going', '.cf-box .btn');
  say(!D().querySelector('[role=dialog]'), 'кнопка закрывает лист');
  await load('home');
  say(!D().querySelector('[role=dialog]'), 'при повторном заходе в том же визите не показан');

  // ── 7. Аккаунт переживает перезагрузку, Delete account его уносит
  head('аккаунт и перезагрузка');
  // Аккаунт НЕ демонстрационный: демо-вход не даёт сессии, а без сессии экран
  // аккаунта закрыт стеной — раздел проверял бы стену вместо диалога удаления.
  await seed({account: {email: 'sam@example.com', via: 'google'},
              plants: [{id:'basil',since:1,day:20,photos:[]}]}, 'home');
  await load('home');
  say(!!S().account && S().account.email === 'sam@example.com', 'аккаунт на месте после перезагрузки');
  await load('account');
  const del = el('Delete account', '.cf-box .danger');
  if (del) { del.click(); await sleep(320) }
  const dlg = D().querySelector('[role=alertdialog]');
  say(!!dlg, 'Delete account сначала спрашивает (диалог есть)');
  say(!!S().account && S().plants.length === 1, 'до ответа ничего не стёрто');
  say(!!dlg && dlg.innerText.includes('1 plant'), 'диалог называет, что исчезнет: '
      + (dlg ? JSON.stringify(dlg.innerText.split('\n')[1] || '').slice(0, 60) : '—'));
  const keep = el('Keep my plants', '.cf-box .btn'); if (keep) { keep.click(); await sleep(260) }
  say(!D().querySelector('[role=alertdialog]') && S().plants.length === 1,
      '«Keep my plants» закрывает диалог и ничего не трогает');
  el('Delete account', '.cf-box .danger').click(); await sleep(300);
  el('Delete it all', '.cf-box .btn').click(); await sleep(320);
  say(!S().account && S().plants.length === 0, 'после подтверждения аккаунт и растения стёрты');
  say(hash() === 'landing', 'после стирания → landing (' + hash() + ')');

  // ── 7b. Живая сессия. Раньше сюда было не дотянуться вовсе, и именно здесь
  //     жили две жалобы: «после входа всегда подписка» и «вход не починился».
  head('живая сессия');
  // Ждём УСЛОВИЯ, а не миллисекунд, и это не педантизм: предыдущий раздел
  // кончается Delete account, а тот не ждёт уборку в облаке — wipeCloud ходит в
  // сеть, и signOut за ним доезжает асинхронно, снося сессию, которую этот
  // раздел кладёт. Фиксированные 1500 мс работали, пока Supabase отвечал
  // быстро, и падали, когда нет: раздел показывал 0/3 при полностью исправном
  // приложении, потому что приложение видело отсутствие сессии и упиралось в
  // стену. Признак завершения выхода — исчезнувший ключ сессии, его и ждём.
  await waitFor(() => localStorage.getItem(SESSION_KEY) === null, 9000);
  await sleep(300);
  putSession(86400);
  // Мина от брошенной попытки: человек ушёл на Google с экрана save и вернулся
  // кнопкой «назад». В hg.authNext осталось слово paywall — и раньше оно
  // срабатывало на СЛЕДУЮЩЕМ обычном запуске.
  localStorage.setItem('hg.authNext', 'paywall');
  clearErr();
  await seed({}, 'home');
  say(!!S().account && S().account.via === 'google', 'аккаунт подхвачен из сессии');
  say(hash() === 'home', 'обычный запуск не уводит на пейволл (' + hash() + ')');
  say(localStorage.getItem('hg.authNext') === null, 'мина hg.authNext обезврежена');

  // ПОРЯДОК ВАЖЕН: раздел про умершую сессию идёт ПОСЛЕДНИМ. Safari держит
  // прошлый документ iframe живым дольше, чем Chromium, и его умирающая сессия
  // рассылает SIGNED_OUT в следующий документ — тот гасил аккаунт и писал
  // «expired» посреди чужого раздела. Проверять после него можно только то,
  // чему живая сессия не нужна.
  // ── 7c. А нарочному выходу объясняться нечем: он и есть объяснение.
  head('нарочный выход не врёт');
  putSession(86400);
  clearErr();
  await seed({account: {email: 'sam@example.com', via: 'google'}}, 'account');
  await tap('Sign out', '.cf-box .btn');
  // Ждём ЗАВЕРШЕНИЯ операции, а не её побочного эффекта: аккаунт гаснет раньше,
  // чем выход доделан (уход на home — последний его шаг), и проверка успевала
  // прочитать состояние на полпути.
  await waitFor(() => hash() === 'home' && !S().account, 8000);
  await sleep(300);
  say(!S().account, 'после Sign out аккаунта нет');
  const de = localStorage.getItem('hg.authErr');
  say(de === null, 'и никакого «session expired» тому, кто нажал сам'
      + (de ? ': ' + JSON.parse(de).kind + ' · экран ' + hash() : ''));

  // ── 7d. Сессия умерла сама. Молчать тут нельзя: человек входил, а потом
  //     видит «Sign in» — и делает единственный доступный ему вывод.
  head('непрошеый выход объясняется');
  putSession(-60);
  clearErr();
  clearOut();
  await seed({account: {email: 'sam@example.com', via: 'google'}}, 'settings');
  // библиотека просит новый токен, получает отказ и сносит сессию, а стена в App
  // уводит на экран входа: без живой сессии приложение недоступно
  await waitFor(() => S().session === 'none' && hash() === 'signin', 8000);
  await sleep(300);
  say(S().session === 'none', 'умершая сессия гасит доступ');
  say(hash() === 'signin', 'стена уводит на вход (' + hash() + ')');
  say(!!S().account, 'но аккаунт помнится: забыть его может только Sign out');
  const ae = JSON.parse(localStorage.getItem('hg.authErr') || 'null');
  say(!!ae && ae.kind === 'expired', 'причина записана видом «expired»: '
      + (ae ? JSON.stringify(ae.kind) : '—'));
  const nt = D().querySelector('.note');
  say(!!nt && nt.innerText.includes('You were signed out'),
      'экран входа объясняет, почему человек тут оказался');
  await sleep(600);             // пусть умирающий документ дорассылает своё
  // Синтетическую сессию убираем: следующий раздел проверяет, что БЕЗ сессии
  // синхронизация не делает ничего, и живая сессия сломала бы ему смысл.
  localStorage.removeItem(SESSION_KEY);

  // ── ЗДЕСЬ НЕТ проверок самой стены и льготы офлайна, и это осознанный раздел
  //     труда, а не пробел: написанные тут, они роняли вкладку Safari целиком и
  //     уносили с собой все 70+ проверок этого стенда. Они живут своей страницей —
  //     tools/stands/gatecheck.html.

  // ── 8. Синхронизация с базой
  head('синхронизация');
  await seed({plants: [{id:'basil',since:1,day:20,photos:[{f:'basil',day:12}]}]}, 'home');
  // Блоб без rid — так выглядят все сохранения, сделанные до синхронизации.
  const p0 = S().plants[0];
  const UUID = /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/;
  say(UUID.test(p0.id), 'старый блоб получил id строки: ' + p0.id);
  say(UUID.test((p0.photos[0] || {}).id || ''), 'снимок тоже получил id');
  await load('home');
  say(S().plants[0].id === p0.id, 'id переживает перезагрузку (не выдаётся заново)');

  // Слияние проверяется своим набором сценариев прямо в этом Safari: полив на
  // двух устройствах, удаление, порядок, кадры с камеры, сходимость.
  const sa = W().__syncAudit ? W().__syncAudit() : 'нет __syncAudit';
  say(sa.startsWith('ALL SYNC CHECKS PASS'), 'слияние: ' + sa.split(' :: ')[0]
      + ' (' + sa.split(' | ').length + ' проверок)');

  // Без входа синхронизация не делает НИЧЕГО: приложение обязано работать
  // анонимно, как работало до неё.
  const rep = await W().__sync();
  say(rep && rep.ok === false && rep.error === 'нет сессии',
      'без сессии проход ничего не делает: ' + JSON.stringify(rep));
  say(localStorage.getItem('hg.sync') === null
      && W().localStorage.getItem('hg.sync') === null,
      'снимок отправки без входа не появился');

  // Дверь по-прежнему закрыта: аноним не читает и не пишет чужие строки.
  const sb2 = await W().__supa();
  const rd = await sb2.from('plants').select('*');
  say(!rd.error && Array.isArray(rd.data) && rd.data.length === 0,
      'аноним читает пустоту, а не чужие растения ('
      + (rd.error ? rd.error.message : rd.data.length + ' строк') + ')');
  const wr = await sb2.from('plants').insert({
    id: '00000000-0000-4000-8000-000000000001',
    user_id: '00000000-0000-4000-8000-000000000002', species_id: 'basil' });
  say(!!wr.error && wr.error.code === '42501',
      'анонимная запись отбита RLS: ' + (wr.error ? wr.error.code + ' ' + wr.error.message : 'ПРОШЛА'));

  // Итог наверх: снизу его закрывает панель Safari. И скролл в ноль — ввод в
  // поля приложения переводит фокус в iframe, а тот прибит к низу страницы,
  // из-за чего Safari уезжает вниз и итога на скриншоте не видно.
  const total = sections.reduce((n, x) => n + x.ok + x.no, 0);
  document.getElementById('verdict').innerHTML = fails
    ? `<span class="no">ПРОВАЛОВ: ${fails} из ${total}</span>`
    : `<span class="ok">ВСЁ ПРОЙДЕНО · ${total} проверок</span>`;
  const sum = sections.map(x => `<span class="${x.no ? 'no' : 'ok'}">${x.no ? '✗' : '✓'}</span>`
    + ` ${x.name} — ${x.ok}/${x.ok + x.no}`).join('<br>');
  const why = failMsgs.length
    ? `<span class="h">── что именно провалилось</span><br>`
      + failMsgs.map(m => `<span class="no">✗</span> ${m}`).join('<br>') + '<br><br>'
    : '';
  LOG.innerHTML = `<span class="h">── итог по разделам</span><br>${sum}<br><br>${why}`
    + out.join('<br>');
  scrollTo(0, 0);
})().catch(e => {
  document.getElementById('verdict').innerHTML =
    '<span class="no">СБОЙ СТЕНДА: ' + e.message + '</span>';
  LOG.innerHTML += '<br><span class="no">СБОЙ: ' + e.message + '</span>';
});
</script>
